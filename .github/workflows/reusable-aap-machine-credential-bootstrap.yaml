---
name: Reusable AAP Machine Credential Bootstrap

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner used to call AAP
        required: false
        type: string
        default: ubuntu-latest
      organization-name:
        description: AAP organization owning the credential
        required: false
        type: string
        default: Default
      credential-name:
        description: Name of the AAP machine credential
        required: false
        type: string
        default: MigrationLab WinRM
      verify-tls:
        description: Verify the AAP gateway TLS certificate
        required: false
        type: boolean
        default: true
    secrets:
      aap-base-url:
        description: AAP platform gateway URL
        required: true
      aap-token:
        description: Rotated AAP API token
        required: true
      windows-username:
        description: Windows account used by AAP over WinRM
        required: true
      windows-password:
        description: Windows password stored in the AAP credential
        required: true
    outputs:
      credential-id:
        description: AAP credential numeric ID
        value: ${{ jobs.credential.outputs.credential-id }}
      operation:
        description: created or updated
        value: ${{ jobs.credential.outputs.operation }}

jobs:
  credential:
    name: Create or update WinRM machine credential
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      credential-id: ${{ steps.credential.outputs.credential_id }}
      operation: ${{ steps.credential.outputs.operation }}
    steps:
      - name: Create or update AAP machine credential
        id: credential
        shell: bash
        env:
          AAP_BASE_URL: ${{ secrets.aap-base-url }}
          AAP_TOKEN: ${{ secrets.aap-token }}
          ORGANIZATION_NAME: ${{ inputs.organization-name }}
          CREDENTIAL_NAME: ${{ inputs.credential-name }}
          WINDOWS_USERNAME: ${{ secrets.windows-username }}
          WINDOWS_PASSWORD: ${{ secrets.windows-password }}
          VERIFY_TLS: ${{ inputs.verify-tls }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import ssl
          import urllib.parse
          import urllib.request

          base = os.environ["AAP_BASE_URL"].rstrip("/")
          token = os.environ["AAP_TOKEN"]
          verify = os.environ["VERIFY_TLS"].lower() == "true"
          context = ssl.create_default_context() if verify else ssl._create_unverified_context()

          def api(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  f"{base}{path}", data=body, method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(request, context=context, timeout=60) as response:
                  content = response.read().decode()
                  return json.loads(content) if content else {}

          api("GET", "/api/controller/v2/ping/")
          org_name = os.environ["ORGANIZATION_NAME"]
          query = urllib.parse.urlencode({"name": org_name})
          organizations = api("GET", f"/api/controller/v2/organizations/?{query}").get("results", [])
          organization = next((x for x in organizations if x["name"] == org_name), None)
          if not organization:
              raise SystemExit(f"AAP organization '{org_name}' was not found")

          types = api("GET", "/api/controller/v2/credential_types/?kind=ssh&managed=true").get("results", [])
          machine_type = next((x for x in types if x["name"] == "Machine"), None)
          if not machine_type:
              raise SystemExit("AAP managed Machine credential type was not found")

          name = os.environ["CREDENTIAL_NAME"]
          query = urllib.parse.urlencode({"name": name, "organization": organization["id"]})
          existing = api("GET", f"/api/controller/v2/credentials/?{query}").get("results", [])
          credential = next((x for x in existing if x["name"] == name), None)
          payload = {
              "name": name,
              "description": "MigrationLab WinRM credential managed by GitHub Actions",
              "organization": organization["id"],
              "credential_type": machine_type["id"],
              "inputs": {
                  "username": os.environ["WINDOWS_USERNAME"],
                  "password": os.environ["WINDOWS_PASSWORD"],
              },
          }
          if credential:
              credential = api("PATCH", f"/api/controller/v2/credentials/{credential['id']}/", payload)
              operation = "updated"
          else:
              credential = api("POST", "/api/controller/v2/credentials/", payload)
              operation = "created"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"credential_id={credential['id']}\noperation={operation}\n")
          print(f"AAP machine credential {operation}; id={credential['id']}")
          PY
