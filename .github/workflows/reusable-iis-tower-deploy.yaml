---
name: Reusable IIS Deployment via Tower

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label that can reach Vault, Artifactory and Ansible Tower
        required: false
        type: string
        default: ubuntu-latest
      environment-name:
        description: GitHub Environment name used for protection/approval
        required: true
        type: string
      artifact-name:
        description: Immutable artifact name
        required: true
        type: string
      artifact-version:
        description: Immutable artifact version
        required: true
        type: string
      artifact-uri:
        description: Artifactory URI produced by CI
        required: true
        type: string
      tower-job-template:
        description: Existing Ansible Tower/AAP job template identifier
        required: true
        type: string
      vault-role:
        description: Existing HashiCorp Vault role used by the enterprise wrapper
        required: true
        type: string
      vault-secret-path:
        description: Vault path containing deployment credentials/configuration
        required: true
        type: string
      site-name:
        description: IIS website name
        required: true
        type: string
      app-pool-name:
        description: IIS application pool name
        required: true
        type: string
      physical-path:
        description: IIS physical deployment path
        required: true
        type: string
      host-name:
        description: IIS host header / endpoint host
        required: true
        type: string
      https-port:
        description: HTTPS port
        required: false
        type: number
        default: 443
      certificate-thumbprint:
        description: Certificate thumbprint or approved certificate reference
        required: true
        type: string
      authentication-mode:
        description: IIS authentication mode understood by the Tower template
        required: false
        type: string
        default: Windows
      health-url:
        description: Endpoint used for post-deployment validation
        required: true
        type: string
      config-json:
        description: Non-secret environment-specific configuration JSON
        required: false
        type: string
        default: '{}'
      tower-command:
        description: Enterprise Tower/AAP wrapper executable available on the runner
        required: false
        type: string
        default: enterprise-tower-deploy
      vault-command:
        description: Enterprise Vault wrapper executable available on the runner
        required: false
        type: string
        default: enterprise-vault-read

jobs:
  deploy:
    name: Deploy ${{ inputs.artifact-name }} ${{ inputs.artifact-version }} to ${{ inputs.environment-name }}
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment-name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve deployment secret reference from Vault
        id: vault
        shell: bash
        env:
          VAULT_ROLE: ${{ inputs.vault-role }}
          VAULT_SECRET_PATH: ${{ inputs.vault-secret-path }}
        run: |
          set -euo pipefail
          tool="$(command -v '${{ inputs.vault-command }}')"
          secret_ref="$($tool --role "$VAULT_ROLE" --path "$VAULT_SECRET_PATH" --output-reference)"
          test -n "$secret_ref"
          echo "secret-ref=$secret_ref" >> "$GITHUB_OUTPUT"

      - name: Launch Ansible Tower/AAP IIS deployment
        id: tower
        shell: bash
        env:
          DEPLOYMENT_SECRET_REF: ${{ steps.vault.outputs.secret-ref }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          ARTIFACT_VERSION: ${{ inputs.artifact-version }}
          ARTIFACT_URI: ${{ inputs.artifact-uri }}
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          SITE_NAME: ${{ inputs.site-name }}
          APP_POOL_NAME: ${{ inputs.app-pool-name }}
          PHYSICAL_PATH: ${{ inputs.physical-path }}
          HOST_NAME: ${{ inputs.host-name }}
          HTTPS_PORT: ${{ inputs.https-port }}
          CERTIFICATE_THUMBPRINT: ${{ inputs.certificate-thumbprint }}
          AUTHENTICATION_MODE: ${{ inputs.authentication-mode }}
          HEALTH_URL: ${{ inputs.health-url }}
          CONFIG_JSON: ${{ inputs.config-json }}
        run: |
          set -euo pipefail
          tool="$(command -v '${{ inputs.tower-command }}')"
          "$tool" \
            --job-template '${{ inputs.tower-job-template }}' \
            --wait \
            --extra-vars "$(jq -cn \
              --arg secret_ref "$DEPLOYMENT_SECRET_REF" \
              --arg artifact_name "$ARTIFACT_NAME" \
              --arg artifact_version "$ARTIFACT_VERSION" \
              --arg artifact_uri "$ARTIFACT_URI" \
              --arg environment "$ENVIRONMENT_NAME" \
              --arg site_name "$SITE_NAME" \
              --arg app_pool_name "$APP_POOL_NAME" \
              --arg physical_path "$PHYSICAL_PATH" \
              --arg host_name "$HOST_NAME" \
              --argjson https_port "$HTTPS_PORT" \
              --arg certificate_thumbprint "$CERTIFICATE_THUMBPRINT" \
              --arg authentication_mode "$AUTHENTICATION_MODE" \
              --arg health_url "$HEALTH_URL" \
              --argjson config "$CONFIG_JSON" \
              '{
                deployment_secret_ref: $secret_ref,
                artifact_name: $artifact_name,
                artifact_version: $artifact_version,
                artifact_uri: $artifact_uri,
                environment: $environment,
                iis: {
                  site_name: $site_name,
                  app_pool_name: $app_pool_name,
                  physical_path: $physical_path,
                  host_name: $host_name,
                  https_port: $https_port,
                  certificate_thumbprint: $certificate_thumbprint,
                  authentication_mode: $authentication_mode
                },
                config: $config,
                health_url: $health_url,
                deployment_flow: [
                  "create_site_if_missing",
                  "backup_existing_site",
                  "stop_site_and_app_pool",
                  "download_artifact_from_artifactory",
                  "deploy_artifact",
                  "apply_environment_configuration",
                  "configure_authentication",
                  "configure_https_certificate",
                  "start_app_pool_and_site",
                  "health_check",
                  "rollback_on_failure"
                ]
              }')"

      - name: Final endpoint check from runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 10 '${{ inputs.health-url }}'
